disabled_rules:
  - todo

opt_in_rules:
  - sorted_imports
  - trailing_closure
  - empty_count
  - private_swiftui_state
  - unused_parameter

included:
  - Ditto

excluded:
  - Pods
  - DerivedData
  - .build

line_length:
  warning: 120
  error: 150

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 500
  error: 800

reporter: xcode
